name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Chon loai build (debug de cai ngay tren moi may Android)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        working-directory: ./mobile
        run: npm ci || npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: 🔍 Find and Prepare APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Không tìm thấy file APK sau khi build!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/TungLam-Workspace.apk
          ls -lh build-output/

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TungLam-Workspace-Android-APK
          path: build-output/TungLam-Workspace.apk
          retention-days: 14