name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      env_base64:
        description: 'Base64 encoded .env content'
        required: false
        default: ''
      build_type:
        description: 'Chon loai build (release de chay standalone offline tren moi may Android)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📝 Configure Environment (.env)
        working-directory: ./mobile
        run: |
          if [ -n "${{ github.event.inputs.env_base64 }}" ]; then
            echo "${{ github.event.inputs.env_base64 }}" | base64 -d > .env
          elif [ -n "${{ secrets.MOBILE_ENV }}" ]; then
            echo "${{ secrets.MOBILE_ENV }}" > .env
          fi
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo "Populating .env with project defaults..."
            cat << 'EOF' > .env
EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyCzds1ECsDEFio21dKaFfXJ5gxfUXhcMwU
EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=portfolio-42c34.firebaseapp.com
EXPO_PUBLIC_FIREBASE_PROJECT_ID=portfolio-42c34
EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=portfolio-42c34.firebasestorage.app
EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=1098886400519
EXPO_PUBLIC_FIREBASE_APP_ID=1:1098886400519:web:b4ad245801d323fb4038a2
EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=1034162011132-a0surkqf4e669o9bui0f107t7td3euv5.apps.googleusercontent.com
EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=1034162011132-5c3vm0l3a690lu0732lahbcpot04mouv.apps.googleusercontent.com
EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=1034162011132-kkpc0b8kuasddk8uik89v0l9f1ckit40.apps.googleusercontent.com
EOF
          fi
          echo "✅ .env file successfully configured with $(wc -l < .env) lines"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        working-directory: ./mobile
        run: npm ci || npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build Standalone Release APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          # Ensure release build uses debug.keystore so the APK is signed and can be installed on any device without custom keys
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi

      - name: 🔍 Find and Prepare APK
        run: |
          mkdir -p build-output
          # Prefer signed release APK, then any APK
          APK_FILE=$(find mobile/android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: Không tìm thấy file APK sau khi build!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/TungLam-Workspace.apk
          ls -lh build-output/

      - name: 🚀 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TungLam-Workspace-Android-APK
          path: build-output/TungLam-Workspace.apk
          retention-days: 14